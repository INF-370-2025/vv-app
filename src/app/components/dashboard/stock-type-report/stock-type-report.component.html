<div class="report-container">
  <div class="report-header">
    <div class="report-actions">
      <button
        nz-button
        nzType="primary"
        nzDanger
        (click)="exportToPDF()"
        [nzLoading]="isExporting"
        style="margin-bottom: 16px;"
      >
        <span nz-icon nzType="file-pdf" nzTheme="outline"></span>
        Export to PDF
      </button>
    </div>
  </div>

  <div>
    <div class="report-title">
      <h2>Stock Levels Report</h2>
    </div>

    <div class="report-meta">
      <div>
        <p><strong>Date Generated:</strong> {{ currentDate | date:'M/d/yyyy' }}</p>
        <p><strong>Generated By:</strong> {{ generatedBy }}</p>
      </div>
      <div>
        <p><strong>Stock Type:</strong> {{ getStockTypeName() }}</p>
        <p><strong>Items Shown:</strong> {{ totalItems }}</p>
      </div>
    </div>

    <div class="controls">
      <nz-spin [nzSpinning]="isStockTypesLoading">
        <nz-select
          class="stock-type-select"
          nzShowSearch
          nzAllowClear
          nzPlaceHolder="Filter by stock type"
          [(ngModel)]="selectedStockTypeId"
          (ngModelChange)="onStockTypeChange($event)"
          style="width: 200px; margin-right: 10px;"
        >
          <nz-option
            *ngFor="let type of stockTypes"
            [nzLabel]="type.name"
            [nzValue]="type.stock_type_id"
          >
            <span style="color: #000">{{ type.name }}</span>
          </nz-option>
        </nz-select>

        <button
          *ngIf="selectedStockTypeId"
          nz-button
          nzType="default"
          nzSize="small"
          (click)="clearStockTypeFilter()"
        >
          Clear Filter
        </button>
      </nz-spin>
    </div>

    <div class="chart-container">
      <nz-spin [nzSpinning]="isloadingCard1">
        <canvas #chartCanvas></canvas>
      </nz-spin>

      <div
        *ngIf="!isloadingCard1 && (!chartData || chartData.length === 0)"
        class="no-data"
      >
        <nz-empty nzNotFoundContent="No stock data available"></nz-empty>
      </div>
    </div>


  </div>
</div>
