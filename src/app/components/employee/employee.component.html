<div nz-row [nzJustify]="'center'">
    <div nz-col [nzSpan]="20" style="text-align: start;">
        <h1><b>Employees</b></h1>
    </div>
</div>

<!--Row-->
<div nz-row [nzJustify]="'center'">
    <div nz-col nzSpan="20">
        <!--Spinner-->
        <nz-spin [nzSpinning]="isloading">
            <nz-table #table1 [nzData]="employees" [nzPageSize]="20">
                <thead>
                    <tr>
                        <th colSpan="3">
                            <nz-input-group [nzSuffix]="suffixIconSearch">
                                <input type="text" nz-input placeholder="Search Here" (keyup)="searchEmployees($event)" />
                            </nz-input-group>
                            <ng-template #suffixIconSearch>
                                <i nz-icon nzType="search"></i>
                            </ng-template>
                        </th>
                        <th>Id</th>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody class="table-body">
                    <tr *ngFor="let employee of table1.data">
                        <td></td>
                        <!-- <td>
                                  <nz-avatar nzIcon="user" [nzSrc]="employee.user?.image || 'https://ui-avatars.com/api/?background=17726d&color=fff&&name='+ employee.user?.name"></nz-avatar>
                                </td>
                                <td>-</td>
                                <td>{{employee.unique_identifier || '-'}}</td>
                                <td>{{employee.user?.title?.title_name}}. {{employee.user?.name || '-'}} {{employee.user?.surname || '-'}}</td>
                                <td>{{employee.user?.role?.role_name || '-'}}</td>
                                <td>{{employee.user?.email_address || '-'}}</td>
                                <td>{{employee.user?.phone_number || '-'}}</td> -->
                        <td>
                            <button nz-button nzType="primary" (click)="viewEmployee(employee)">
                          <i nz-icon nzType="eye" nzTheme="outline"></i>
                          View
                        </button>
                        </td>
                    </tr>
                </tbody>
            </nz-table>
        </nz-spin>
        <!--Button-->
        <ng-template #extraTemplate>
            <button nz-button nzType="primary">
              Create New
            <span nzType="plus" nzTheme="outline"></span>
          </button>
        </ng-template>
    </div>
</div>

<!--Modal-->
<nz-modal [nzWidth]="800" [(nzVisible)]="showEmployeeModal" nzClosable="true" [nzTitle]="title" (nzOnCancel)="showEmployeeModal=false;" [nzFooter]="null">
    <ng-template #title>
        <!-- <b>{{viewingEmployee.user?.title?.title_name}}. {{viewingEmployee.user?.name}} {{viewingEmployee.user?.surname}}</b> -->
    </ng-template>
    <ng-container *nzModalContent>
        <div nz-row [nzJustify]="'center'" [nzGutter]="[24,24]">
            <!--
            <div nz-col [nzXs]="24" [nzSm]="24" [nzMd]="10" [nzLg]="10" [nzXl]="10">
                <gallery gallerize class="gallery-images-jobs" [orientation]="'vertical'" [thumbs]="true"  [bullets]="true" [bulletPosition]="'bottom'" [imageSize]="'cover'" [autoHeight]="true"></gallery>
            </div>
            -->
            <br>
            <div nz-col [nzXs]="24" [nzSm]="24" [nzMd]="14" [nzLg]="14" [nzXl]="14">
                <div nz-row [nzJustify]="'center'" [nzGutter]="[24,24]">
                    <!--Employee Id-->
                    <div nz-col [nzXs]="24" [nzSm]="24" [nzMd]="24" [nzLg]="24" [nzXl]="24">
                        <span style="font-size: 15px;"><b>Employee Id</b></span>
                        <br style="margin-top: 5px;">
                        <hr class="hr">
                        <!-- <span nz-icon nzType="vv:employees" nzTheme="outline" class="color"></span> {{viewingEmployee.unique_identifier}} |
                        <p *ngIf="viewingEmployee.authorized_access == true">Authorized</p>
                        <p *ngIf="viewingEmployee.authorized_access == false">Unauthorized</p> -->
                    </div>
                    <!--Company Position-->
                    <div nz-col [nzXs]="24" [nzSm]="24" [nzMd]="24" [nzLg]="24" [nzXl]="24">
                        <span style="font-size: 15px;"><b>Company Position</b></span>
                        <br style="margin-top: 5px;">
                        <hr class="hr">
                        <!-- <span nz-icon nzType="calendar" nzTheme="outline" class="color"></span> {{viewingEmployee.type?.type_name}} | {{viewingEmployee.user?.role?.role_name}} -->
                    </div>
                    <!--Personal Details-->
                    <div nz-col [nzXs]="24" [nzSm]="24" [nzMd]="24" [nzLg]="24" [nzXl]="24">
                        <span style="font-size: 15px;"><b>Personal Details</b></span> <br>
                        <hr class="hr">
                        <!-- <nz-avatar nzIcon="user" [nzSrc]="viewingEmployee.user?.image || 'https://ui-avatars.com/api/?background=17726d&color=fff&&name='+ viewingEmployee.user?.name"></nz-avatar>
                        {{viewingEmployee.user?.title?.title_name}}. {{viewingEmployee.user?.name}} {{viewingEmployee.user?.surname}} -->
                    </div>
                    <!--Contact Details-->
                    <div nz-col [nzXs]="24" [nzSm]="24" [nzMd]="24" [nzLg]="24" [nzXl]="24">
                        <span style="font-size: 15px;"><b>Contact Details</b></span> <br>
                        <hr class="hr">
                        <!-- <span nz-icon nzType="phone" nzTheme="outline" class="color"></span> {{viewingEmployee.user?.phone_number}} |
                        <span nz-icon nzType="mail" nzTheme="outline" class="color"></span> {{viewingEmployee.user?.email_address }} -->
                    </div>
                    <!--Warnings-->
                    <div nz-col [nzXs]="24" [nzSm]="24" [nzMd]="24" [nzLg]="24" [nzXl]="24">
                        <span style="font-size: 15px;"><b>Warnings</b></span> <br>
                        <hr class="hr">
                        <span nz-icon nzType="exclamation" nzTheme="outline" class="color"></span> {{warningCount}} |
                        <button nz-button nzType="default" nzJustify="center">
                              <span nz-icon nzType="vv:warning" nzTheme="outline"></span>
                              View Warnings
                            </button>
                        <br><br>
                    </div>
                </div>
                <div nz-row [nzJustify]="'center'" [nzGutter]="[24,24]">
                    <div nz-col [nzXs]="24" [nzSm]="24" [nzMd]="24" [nzLg]="24" [nzXl]="24">
                        <nz-button-group>
                            <button nz-button nzType="default">
                              <span nz-icon nzType="printer" nzTheme="outline"></span>
                              Edit Access
                            </button>
                            <button nz-button nzType="default" style="background-color: lightseagreen;color: white;border: none;">
                              <span nz-icon nzType="check" nzTheme="outline"></span>
                              Update Details
                            </button>
                            <button nz-button nzType="default" style="background-color: rgb(252, 61, 61);color: white;border: none;">
                              <span nz-icon nzType="close" nzTheme="outline"></span>
                              Delete Employee
                            </button>
                        </nz-button-group>
                    </div>
                </div>
            </div>
        </div>
    </ng-container>
</nz-modal>
