<div class="report-container">
  <div class="report-header">
    <div class="report-actions">
      <button
        nz-button
        nzType="primary"
        nzDanger
        (click)="exportToPDF()"
        [nzLoading]="isExporting"
        style="margin-bottom: 16px;"
      >
        <span nz-icon nzType="file-pdf" nzTheme="outline"></span>
        Export to PDF
      </button>
    </div>
  </div>

  <div>
    <div class="report-title">
      <h2>Job Cards Status Report</h2>
    </div>

    <!-- Report Metadata -->
    <div class="report-meta">
      <div>
        <p><strong>Date Generated:</strong> {{ currentDate | date:'mediumDate' }}</p>
        <p><strong>Generated By:</strong> {{ generatedBy }}</p>
      </div>
      <div>
        <p><strong>Total Job Cards:</strong> {{ totalJobCards }}</p>
      </div>
    </div>

    <!-- Chart Container -->
    <div class="chart-container">
      <canvas #chartCanvas></canvas>
      <div *ngIf="isLoading" class="loading-overlay">
        <nz-spin nzSize="large"></nz-spin>
      </div>
      <div
        *ngIf="!isLoading && jobCards.length === 0"
        class="no-data"
      >
        <nz-empty nzNotFoundContent="No job cards available"></nz-empty>
      </div>
    </div>

    <div class="report-footer">
      <p>Generated on: {{currentDate | date:'longDate'}}</p>
      <p>Vault Vision - Workforce Management System</p>
    </div>
  </div>
</div>
