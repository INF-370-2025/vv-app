<div class="report-container">
  <div class="report-header">
    <div class="report-actions">
      <button
        nz-button
        nzType="primary"
        nzDanger
        (click)="exportToPDF()"
        [nzLoading]="isExporting"
        style="margin-bottom: 16px;"
      >
        <span nz-icon nzType="file-pdf" nzTheme="outline"></span>
        Export to PDF
      </button>
    </div>
  </div>

  <div>
    <div class="report-title">
      <h2>Stock Levels Report</h2>
    </div>

    <div class="report-meta">
      <div>
        <p><strong>Date Generated:</strong> {{ currentDate | date:'M/d/yyyy' }}</p>
        <p><strong>Generated By:</strong> {{ generatedBy }}</p>
      </div>
      <div>
        <p><strong>Stock Type:</strong> {{ getStockTypeName() }}</p>
        <p><strong>Items Shown:</strong> {{ totalItems }}</p>
      </div>
    </div>

    <div class="controls">
      <div class="form-group">
        <label>Filter by Stock Type:</label>
        <select
          [(ngModel)]="selectedStockTypeId"
          (change)="onStockTypeChange($event)"
          [disabled]="isLoading"
        >
          <option [value]="null">All Types</option>
          <option *ngFor="let type of stockTypes" [value]="type.stock_type_id">
            {{ type.name }}
          </option>
        </select>
        <button
          nz-button
          nzType="default"
          (click)="clearStockTypeFilter()"
          [disabled]="!selectedStockTypeId || isLoading"
        >
          Clear Filter
        </button>
      </div>
    </div>

    <div class="chart-container">
      <canvas #chartCanvas></canvas>

      <div *ngIf="isLoading" class="loading-overlay">
        <nz-spin nzSize="large"></nz-spin>
      </div>

      <div
        *ngIf="!isLoading && (!chartData || chartData.length === 0)"
        class="no-data"
      >
        <nz-empty nzNotFoundContent="No stock data available"></nz-empty>
      </div>
    </div>

    <div class="report-footer">
      <p>Generated on: {{ currentDate | date:'longDate' }}</p>
      <p>Vault Vision - Inventory Management System</p>
    </div>
  </div>
</div>
