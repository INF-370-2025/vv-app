<div class="report-container">
  <div class="report-header">
    <div class="report-actions">
      <button
        nz-button
        nzType="primary"
        nzDanger
        (click)="exportToPDF()"
        [nzLoading]="isExporting"
        style="margin-bottom: 16px;"
      >
        <span nz-icon nzType="file-pdf" nzTheme="outline"></span>
        Export to PDF
      </button>
    </div>
  </div>

  <div>
    <div class="report-title">
      <h2>Monthly Hours Worked Report - {{selectedYear}}</h2>
    </div>

    <!-- Report Metadata -->
    <div class="report-meta">
      <div>
        <p><strong>Date Generated:</strong> {{ currentDate | date:'M/d/yyyy' }}</p>
        <p><strong>Generated By:</strong> {{ generatedBy }}</p>
      </div>
      <div>
        <p><strong>Total Hours:</strong> {{ totalHours | number:'1.0-0' }}</p>
        <p><strong>Reporting Year:</strong> {{ selectedYear }}</p>
      </div>
    </div>

    <div class="controls">
      <div class="form-group">
        <label>Select Year:</label>
        <nz-select
          [(ngModel)]="selectedYear"
          (ngModelChange)="generateReport()"
          [nzLoading]="isLoading"
          style="width: 120px;"
        >
          <nz-option
            *ngFor="let year of yearOptions"
            [nzLabel]="year.toString()"
            [nzValue]="year"
          ></nz-option>
        </nz-select>
      </div>
    </div>

    <div class="chart-container">
      <canvas #chartCanvas></canvas>

      <div
        *ngIf="!isLoading && (!chart || monthlyData.length === 0)"
        class="no-data"
      >
        <nz-empty nzNotFoundContent="No data available for selected year"></nz-empty>
      </div>
    </div>

    <div class="report-footer">
      <p>Generated on: {{currentDate | date:'longDate'}}</p>
      <p>Vault Vision</p>
    </div>
  </div>
</div>
