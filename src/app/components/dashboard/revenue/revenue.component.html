<div class="report-container">
  <div class="report-header">
    <div class="report-actions">
      <button
        nz-button
        nzType="primary"
        nzDanger
        (click)="exportToPDF()"
        [nzLoading]="isExporting"
        style="margin-bottom: 16px;"
      >
        <span nz-icon nzType="file-pdf" nzTheme="outline"></span>
        Export to PDF
      </button>
    </div>
  </div>

  <div>
    <div class="report-title">
      <h2>Revenue Report - Past 6 Months</h2>
    </div>

    <!-- Report Metadata -->
    <div class="report-meta">
      <div>
        <p><strong>Date Generated:</strong> {{ currentDate | date:'M/d/yyyy' }}</p>
        <p><strong>Generated By:</strong> {{ generatedBy }}</p>
      </div>
      <div>
        <p><strong>Total Revenue:</strong> R {{ totalRevenue | number:'1.2-2' }}</p>
        <p><strong>Total Invoices:</strong> {{ totalInvoices }}</p>
      </div>
    </div>

    <div class="chart-container">
      <canvas #revenueChart></canvas>

      <div *ngIf="!isLoading && (!chart || revenueData.length === 0)" class="no-data">
        <nz-empty nzNotFoundContent="No revenue data available"></nz-empty>
      </div>
    </div>

    <div class="report-footer">
      <p>Generated on: {{currentDate | date:'longDate'}}</p>
      <p>Vault Vision</p>
    </div>
  </div>
</div>
